on:
 pull_request:
    types: ['opened', 'reopened', 'synchronize']
jobs:
    check-for-changes:
        runs-on: ubuntu-latest
        outputs:
            changed: ${{steps.filter.outputs.changed}}
        steps:
            - uses: dorny/paths-filter@v4
              id: filter
              with:
                filters: |
                    changed: 
                        - packages/inverify-typeorm/src/**
    
    test:
        needs: check-for-changes
        if: ${{needs.check-for-changes.outputs.changed}}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v7
              with:
                node-version: '24'
            - run: npm install
            - run: |
                cd packages/inversify-typeorm
                npx vitest run
    
    build:
        needs: check-for-changes
        if: ${{needs.check-for-changes.outputs.changed}}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v7
              with:
                node-version: '24'
            - run: npm install
            - run: |
                cd packages/inversify-typeorm
                npx tsc